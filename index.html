<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mr Ken's timetable 2026/27</title>
  <style>
    :root {
      --ink: #161616;
      --muted: #6a6a6a;
      --line: #e4e4e4;
      --wash: #f4f4f4;
      --card: #efefef;
    }

    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0 auto;
      max-width: 1100px;
      padding: 10px 12px 40px;
      color: var(--ink);
      background: #fff;
      font: 15px/1.35 "Segoe UI", system-ui, sans-serif;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      margin: 0 0 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }
    header p {
      margin: 0;
      flex: 1 1 auto;
      min-width: 0;
      font-size: 12px;
      line-height: 1.3;
      color: var(--muted);
    }
    #head-title {
      color: var(--ink);
      font-weight: 650;
      text-decoration: none;
      -webkit-touch-callout: none;
      user-select: none;
    }
    #head-title[href]:hover, a.note:hover { text-decoration: underline; }
    a.note { color: inherit; text-decoration: none; }
    #meta { font-size: 12px; color: var(--muted); }
    #meta[hidden] { display: none; }

    nav { display: flex; flex-wrap: wrap; gap: 6px; }
    header nav { flex: 0 0 auto; }
    nav a, nav button {
      appearance: none;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 4px 10px;
      font: inherit;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }
    nav a.on, nav button.on {
      background: var(--ink);
      color: #fff;
    }

    .days { margin: 0 0 8px; }
    @media (min-width: 800px) {
      .days { display: none; }
    }

    main { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 5px 4px;
      text-align: center;
      vertical-align: middle;
    }
    thead th {
      padding: 1px 4px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.15;
      color: var(--muted);
    }
    tbody th {
      width: 92px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      position: sticky;
      left: 0;
      background: #fff;
    }
    th a {
      color: inherit;
      text-decoration: none;
    }
    th a:hover, th a:focus-visible { text-decoration: underline; }
    tbody th small {
      display: block;
      font-weight: 400;
      color: var(--muted);
    }
    tr.break th, tr.break td { background: var(--wash); }
    tr.break th { background: var(--wash); }
    tr.now th { box-shadow: inset 3px 0 0 var(--ink); }

    td button {
      appearance: none;
      width: 100%;
      min-height: 36px;
      border: 0;
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.22s ease, color 0.22s ease;
    }
    td button:hover, td button:focus-visible, td.open > button { background: var(--ink); color: #fff; }
    .pick {
      display: grid;
      grid-template-rows: 0fr;
      margin-top: 0;
      opacity: 0;
      text-align: left;
      pointer-events: none;
      transition: grid-template-rows 0.32s ease, opacity 0.24s ease, margin-top 0.32s ease, transform 0.32s ease;
    }
    .pick-in { overflow: hidden; min-height: 0; }
    .open > .pick {
      grid-template-rows: 1fr;
      margin-top: 4px;
      opacity: 1;
      pointer-events: auto;
    }
    .pick a {
      display: block;
      border: 0;
      border-radius: 4px;
      padding: 3px 4px;
      background: none;
      color: var(--ink);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.3;
      text-decoration: none;
    }
    .pick a:hover, .pick a:focus-visible { background: var(--wash); }
    td small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .note { color: var(--muted); font-size: 13px; }

    .classes {
      margin-top: 8px;
      padding-top: 0;
      gap: 3px;
    }
    .classes .chip { position: relative; }
    .classes button {
      appearance: none;
      min-width: 0;
      border: 1px solid var(--ink);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 1px 6px;
      font: inherit;
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
    }
    .classes button { transition: background 0.22s ease, color 0.22s ease; }
    .classes .chip.open > button { background: var(--ink); color: #fff; }
    .classes .pick {
      position: absolute;
      left: 0;
      top: 100%;
      z-index: 2;
      min-width: 9.5em;
      margin-top: 0;
      padding: 0 2px;
      background: #fff;
      border: 1px solid transparent;
      transform: translateY(-4px);
    }
    .classes .chip.open > .pick {
      margin-top: 2px;
      padding: 2px;
      border-color: var(--line);
      transform: none;
    }
    @media (prefers-reduced-motion: reduce) {
      td button, .classes button, .pick { transition: none; }
    }

    #back {
      border: 0;
      background: none;
      padding: 0;
      margin: 0;
      font-size: 18px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
    }
    #class-page[hidden], main[hidden], .days[hidden], .classes[hidden], #weeks[hidden], #back[hidden], #class-pick[hidden], #hello[hidden] { display: none; }

    #hello {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.72);
    }
    #hello div {
      max-width: 22em;
      padding: 16px 16px 12px;
      background: #fff;
      border: 1px solid var(--line);
    }
    #hello p { margin: 0 0 8px; }
    #hello-time {
      margin: 0 0 12px;
      font-size: 28px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      line-height: 1.2;
    }
    #hello-time[hidden] { display: none; }
    #hello button {
      appearance: none;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      border-radius: 999px;
      padding: 5px 14px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    #photos {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    #photos li {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 72px;
      background: var(--wash);
      border: 1px solid var(--line);
    }
    #photos li.empty { background: #fafafa; }
    #photos img {
      display: block;
      width: 100%;
      height: auto;
      flex: 1 1 auto;
    }
    #photos b {
      position: absolute;
      top: 0;
      right: 0;
      min-width: 1em;
      padding: 0 3px;
      margin: 0;
      background: #fff;
      border: 0;
      border-left: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }
    #photos input {
      display: block;
      width: 100%;
      margin-top: auto;
      border: 0;
      border-top: 1px solid var(--line);
      padding: 2px 4px;
      background: #fff;
      font: inherit;
      font-size: 11px;
      line-height: 1.25;
    }

    @media (max-width: 799px) {
      table { min-width: 0; }
      body.filter-1 table .d2,
      body.filter-1 table .d3,
      body.filter-1 table .d4,
      body.filter-1 table .d5,
      body.filter-2 table .d1,
      body.filter-2 table .d3,
      body.filter-2 table .d4,
      body.filter-2 table .d5,
      body.filter-3 table .d1,
      body.filter-3 table .d2,
      body.filter-3 table .d4,
      body.filter-3 table .d5,
      body.filter-4 table .d1,
      body.filter-4 table .d2,
      body.filter-4 table .d3,
      body.filter-4 table .d5,
      body.filter-5 table .d1,
      body.filter-5 table .d2,
      body.filter-5 table .d3,
      body.filter-5 table .d4 { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <a href="#a" id="back" hidden title="Timetable">🕒</a>
    <p><a id="head-title" href="https://docs.google.com/document/d/1iiptvZl5o9lI2E7PPfiTqL39MNSafXNklrajUkv0shw/edit?tab=t.0" target="_blank" rel="noopener">🐢Mr Ken's timetable 2026/27</a> <span id="meta" hidden></span></p>
    <nav class="weeks" id="weeks" aria-label="Week">
      <a href="#a" id="link-a">Week A</a>
      <a href="#b" id="link-b">Week B</a>
    </nav>
    <nav id="class-pick" hidden>
      <a id="pick-room" hidden target="_blank" rel="noopener">GoogleClassroom</a>
    </nav>
  </header>

  <nav class="days" id="days" aria-label="Day"></nav>
  <main id="board"></main>
  <nav class="classes" id="class-index" aria-label="Classes"></nav>

  <section id="class-page" hidden>
    <ol id="photos"></ol>
  </section>

  <div id="hello" hidden>
    <div>
      <p id="hello-text"></p>
      <p id="hello-time" hidden></p>
      <button type="button" id="hello-ok">OK</button>
    </div>
  </div>

  <script src="classes.js"></script>
  <script>
    const IMG = "images/";
    const DOC = "https://docs.google.com/document/d/1iiptvZl5o9lI2E7PPfiTqL39MNSafXNklrajUkv0shw/edit?tab=t.0";
    const LINKS = {
      "DEAR time": "https://dear-time.netlify.app/",
      "Flag-raising": "https://us02web.zoom.us/j/83329409406?pwd=qWY6KmEgAW7ItCVKDzpYOW6OBbyHbw.1",
      "Homeroom Duty": "https://drive.google.com/drive/u/8/folders/1IL-Dg2WHjX6JIp1xWBltv4lxfreFMT-A"
    };
    const PERIOD_SHEET = "https://docs.google.com/spreadsheets/d/1r_Evr8fo5pxsliaSprcCcsfhwC28wJZugr5oKvd1u4Y/edit?gid=1185093567#gid=1185093567";
    const SLIDE_L0 = "https://docs.google.com/presentation/d/1nwUWduByxr4MRLeRhGfrLu1D0abYV-e3MIGsLVKTnCY/edit?usp=sharing";
    const SLIDE_L1 = "https://docs.google.com/presentation/d/1Jpp_MY-O4TfeyFCYBbJOewvwzKFC0uu1t_CtXx46fKI/edit?slide=id.g3fa3b55f791_32_0#slide=id.g3fa3b55f791_32_0";
    const ROOMS = {
      "7AJ": "https://classroom.google.com/u/8/c/ODc2NzUzODYyNjk3",
      "9GK": "https://classroom.google.com/u/8/c/ODc3MjY0OTY3NDM2",
      "7KS": "https://classroom.google.com/u/8/c/ODY5NDA2NDMxMjgw",
      "9PS": "https://classroom.google.com/u/8/c/ODc3MjcwNDM5MTMx",
      "8CW": "https://classroom.google.com/u/8/c/ODc3OTcxMjM1MzA1",
      "8EJ": "https://classroom.google.com/u/8/c/ODc3OTc3MDIyMDUw",
      "8JE": "https://classroom.google.com/u/8/c/ODc3Mjc3MzAzOTc5",
      "9SV": "https://classroom.google.com/u/8/c/ODc2NzMwMDM1MTM5",
      "9KS": "https://classroom.google.com/u/8/c/ODY5MzUzNjkzNjYy"
    };
    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
    const ROWS = [
      ["hr", "08:30–09:00", ""],
      ["l1", "L1", "09:00–09:40"],
      ["l2", "L2", "09:40–10:20"],
      ["l3", "L3", "10:20–11:00"],
      ["rec", "11:00–11:15", ""],
      ["l4", "L4", "11:15–11:55"],
      ["l5", "L5", "11:55–12:35"],
      ["lunch", "12:35–13:05", ""],
      ["lrec", "13:05–13:35", ""],
      ["l6", "L6", "13:35–14:15"],
      ["l7", "L7", "14:15–14:55"],
      ["l8", "L8", "14:55–15:35"],
      ["end", "15:35–15:45", ""],
      ["late", "15:45–16:00", ""]
    ];
    const WEEK = {
      a: {
        hr:    ["Homeroom Duty", "Homeroom Duty", "Homeroom Duty", "Homeroom Duty", "Homeroom Duty"],
        hrNote:["", "DEAR time", "", "", "Flag-raising"],
        l1:    ["8EJ", "8CW", "8AE", "", "7NS"],
        l2:    ["7KS", "", "8AE", "5JA", "5MA"],
        l3:    ["8CW", "", "", "9RR", "5MA"],
        rec:   ["", "", "", "", ""],
        l4:    ["6SR", "6YS", "", "", ""],
        l5:    ["6SR", "6YS", "7/F Duty", "9KS", ""],
        l5Note:["", "", "12:15–12:45", "", ""],
        lunch: ["", "", "", "", ""],
        lrec:  ["", "", "", "", ""],
        l6:    ["9GK", "", "", "8AJ", "8AJ"],
        l7:    ["", "7NR", "Homeroom Duty", "7AL", "4NR"],
        l8:    ["9SV", "9RR", "", "", "4NR"],
        l8Note:["", "", "Early release / CCA", "", ""],
        end:   ["Homeroom Duty", "Homeroom Duty", "", "Homeroom Duty", "Homeroom Duty"],
        late:  ["", "", "", "", "New Wing Duty"],
        lateNote:["", "", "", "", "4–7/F"]
      },
      b: {
        hr:    ["Homeroom Duty", "Homeroom Duty", "Homeroom Duty", "Homeroom Duty", "Homeroom Duty"],
        hrNote:["", "DEAR time", "", "", "Flag-raising"],
        l1:    ["", "", "", "", "8JE"],
        l1Note:["", "", "", "Chapel", ""],
        l2:    ["", "", "", "7NS", ""],
        l3:    ["7AL", "9SV", "", "", "7KS"],
        rec:   ["", "", "", "", ""],
        l4:    ["9PS", "9KS", "", "8JE", "4IR"],
        l5:    ["7NR", "", "", "", "4IR"],
        lunch: ["Astro Turf Duty", "", "", "", "7/F Duty"],
        lrec:  ["", "", "", "", ""],
        l6:    ["7AJ", "", "", "9PS", ""],
        l7:    ["4KJ", "5DH", "Homeroom Duty", "", "4SA"],
        l8:    ["8EJ", "7AJ", "", "9GK", "4SA"],
        l8Note:["", "", "Early release / CCA", "", ""],
        end:   ["Homeroom Duty", "Homeroom Duty", "", "Homeroom Duty", "Homeroom Duty"],
        late:  ["", "", "", "", ""]
      }
    };

    const board = document.getElementById("board");
    const classPage = document.getElementById("class-page");
    const classIndex = document.getElementById("class-index");
    const daysNav = document.getElementById("days");
    const back = document.getElementById("back");
    const weeksNav = document.getElementById("weeks");
    const classPick = document.getElementById("class-pick");
    const pickRoom = document.getElementById("pick-room");
    const headTitle = document.getElementById("head-title");
    const meta = document.getElementById("meta");
    let week = "a";
    let dayFilter = 0;
    let showPhotos = false;
    let photoHold = 0;
    let openClass = "";

    function isClass(code) {
      return Boolean(code && (CLASSES[code] || /^[4-9][A-Z]{2}$/.test(code)));
    }

    function periodKey() {
      const now = new Date();
      const mins = now.getHours() * 60 + now.getMinutes();
      const wed = now.getDay() === 3;
      const bands = [
        ["hr", 8 * 60 + 30, 9 * 60],
        ["l1", 9 * 60, 9 * 60 + 40],
        ["l2", 9 * 60 + 40, 10 * 60 + 20],
        ["l3", 10 * 60 + 20, 11 * 60],
        ["rec", 11 * 60, 11 * 60 + 15],
        ["l4", 11 * 60 + 15, 11 * 60 + 55],
        ["l5", 11 * 60 + 55, wed ? 12 * 60 + 15 : 12 * 60 + 35],
        ["lunch", wed ? 12 * 60 + 15 : 12 * 60 + 35, 13 * 60 + 5],
        ["lrec", 13 * 60 + 5, 13 * 60 + 35],
        ["l6", 13 * 60 + 35, 14 * 60 + 15],
        ["l7", 14 * 60 + 15, 14 * 60 + 55],
        ["l8", 14 * 60 + 55, 15 * 60 + 35],
        ["end", 15 * 60 + 35, 15 * 60 + 45],
        ["late", 15 * 60 + 45, 16 * 60]
      ];
      for (const [id, start, end] of bands) {
        if (mins >= start && mins < end) return id;
      }
      return "";
    }

    function closePicks(except) {
      document.querySelectorAll(".open").forEach(el => {
        if (el !== except) el.classList.remove("open");
      });
    }

    function attachPick(host, code, trigger) {
      const pick = document.createElement("div");
      pick.className = "pick";
      const inner = document.createElement("div");
      inner.className = "pick-in";
      if (CLASSES[code]) {
        const a = document.createElement("a");
        a.href = "#" + code + "-list";
        a.textContent = "ClassList";
        inner.append(a);
      }
      if (/^7[A-Z]{2}$/.test(code)) {
        const a = document.createElement("a");
        a.href = SLIDE_L1;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Slide L1";
        inner.append(a);
      }
      if (/^8[A-Z]{2}$/.test(code)) {
        const a = document.createElement("a");
        a.href = SLIDE_L0;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "Slide L0";
        inner.append(a);
      }
      if (ROOMS[code]) {
        const a = document.createElement("a");
        a.href = ROOMS[code];
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = "GoogleClassroom";
        inner.append(a);
      }
      trigger.addEventListener("click", e => {
        e.stopPropagation();
        if (!inner.childNodes.length) return;
        const open = host.classList.contains("open");
        closePicks();
        if (!open) host.classList.add("open");
      });
      host.append(trigger);
      if (inner.childNodes.length) {
        pick.append(inner);
        host.append(pick);
      }
    }

    function cell(code, note) {
      const td = document.createElement("td");
      if (isClass(code) || ROOMS[code]) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = code;
        attachPick(td, code, btn);
      } else if (LINKS[code]) {
        const a = document.createElement("a");
        a.className = "note";
        a.href = LINKS[code];
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = code;
        td.append(a);
      } else if (code) {
        const span = document.createElement("span");
        span.className = "note";
        span.textContent = code;
        td.append(span);
      }
      if (note) {
        const small = document.createElement("small");
        if (LINKS[note]) {
          const a = document.createElement("a");
          a.className = "note";
          a.href = LINKS[note];
          a.target = "_blank";
          a.rel = "noopener";
          a.textContent = note;
          small.append(a);
        } else {
          small.textContent = note;
        }
        td.append(small);
      }
      return td;
    }

    function renderTable() {
      const data = WEEK[week];
      const nowRow = periodKey();
      const today = new Date().getDay();
      let html = "<table><thead><tr><th scope='col'><a href='" + PERIOD_SHEET + "' target='_blank' rel='noopener'>Period</a></th>";
      DAYS.forEach((d, i) => {
        const mark = today === i + 1 ? " on" : "";
        html += "<th scope='col' class='d" + (i + 1) + mark + "'>" + d + "</th>";
      });
      html += "</tr></thead><tbody></tbody></table>";
      board.innerHTML = html;
      const tbody = board.querySelector("tbody");

      ROWS.forEach(([id, label, time, kind]) => {
        const codes = data[id] || ["", "", "", "", ""];
        const notes = data[id + "Note"] || ["", "", "", "", ""];
        if (id === "late" && codes.every(c => !c) && notes.every(n => !n)) return;
        const tr = document.createElement("tr");
        if (kind === "break") tr.className = "break";
        if (id === nowRow) tr.classList.add("now");
        const th = document.createElement("th");
        th.scope = "row";
        const period = document.createElement("a");
        period.href = PERIOD_SHEET;
        period.target = "_blank";
        period.rel = "noopener";
        period.append(label);
        if (time) {
          const t = document.createElement("small");
          t.textContent = time;
          period.append(t);
        }
        th.append(period);
        tr.append(th);
        codes.forEach((code, i) => {
          if (week === "a" && id === "lunch" && i === 2) return;
          const td = cell(code, notes[i]);
          td.className = "d" + (i + 1);
          if (week === "a" && id === "l5" && i === 2) td.rowSpan = 2;
          tr.append(td);
        });
        tbody.append(tr);
      });
    }

    function renderDays() {
      daysNav.replaceChildren();
      const all = document.createElement("button");
      all.type = "button";
      all.textContent = "All";
      all.className = dayFilter === 0 ? "on" : "";
      all.addEventListener("click", () => setDay(0));
      daysNav.append(all);
      DAYS.forEach((d, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = d;
        btn.className = dayFilter === i + 1 ? "on" : "";
        btn.addEventListener("click", () => setDay(i + 1));
        daysNav.append(btn);
      });
    }

    function setDay(n) {
      dayFilter = n;
      bodyFilter();
      renderDays();
    }

    function bodyFilter() {
      document.body.className = document.body.className
        .split(/\s+/)
        .filter(c => c && !c.startsWith("filter-"))
        .join(" ");
      if (dayFilter) document.body.classList.add("filter-" + dayFilter);
    }

    function nickKey(code, n) {
      return code + ":" + n;
    }

    function loadNicks() {
      try {
        return JSON.parse(localStorage.getItem("nicks") || "{}");
      } catch (e) {
        return {};
      }
    }

    function saveNick(code, n, value) {
      const all = loadNicks();
      const key = nickKey(code, n);
      if (value.trim()) all[key] = value;
      else delete all[key];
      localStorage.setItem("nicks", JSON.stringify(all));
    }

    function setClassHead(code) {
      board.hidden = true;
      daysNav.hidden = true;
      classIndex.hidden = true;
      weeksNav.hidden = true;
      back.hidden = false;
      back.href = "#" + week;
      classPick.hidden = !ROOMS[code];
      headTitle.removeAttribute("href");
      headTitle.removeAttribute("target");
      headTitle.textContent = code;
      meta.hidden = false;
      const cls = CLASSES[code];
      meta.textContent = cls ? cls.when : "";
      if (ROOMS[code]) {
        pickRoom.hidden = false;
        pickRoom.href = ROOMS[code];
      } else {
        pickRoom.hidden = true;
        pickRoom.removeAttribute("href");
      }
    }

    function renderIndex() {
      classIndex.replaceChildren();
      const codes = [...new Set([...Object.keys(CLASSES), ...Object.keys(ROOMS)])];
      codes.sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).forEach(code => {
        const chip = document.createElement("span");
        chip.className = "chip";
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = code;
        attachPick(chip, code, btn);
        classIndex.append(chip);
      });
    }

    function showClass(code) {
      const cls = CLASSES[code];
      if (!cls) return showWeek(week);
      setClassHead(code);
      classPage.hidden = false;
      const present = cls.students.filter(s => s.img).length;
      meta.textContent = cls.when + " · " + present + " students";
      const photos = document.getElementById("photos");
      const nicks = loadNicks();
      photos.replaceChildren();
      cls.students.forEach(s => {
        const li = document.createElement("li");
        const num = document.createElement("b");
        num.textContent = s.n;
        if (s.img && showPhotos) {
          const img = document.createElement("img");
          img.src = IMG + s.img;
          img.alt = code + " " + s.n;
          img.loading = "lazy";
          li.append(img);
        } else {
          li.className = "empty";
        }
        const nick = document.createElement("input");
        nick.type = "text";
        nick.autocomplete = "off";
        nick.spellcheck = false;
        nick.value = nicks[nickKey(code, s.n)] ?? s.nick ?? "";
        nick.addEventListener("input", () => saveNick(code, s.n, nick.value));
        li.append(num);
        li.append(nick);
        photos.append(li);
      });
      openClass = code;
      document.getElementById("link-a").className = "";
      document.getElementById("link-b").className = "";
      window.scrollTo(0, 0);
    }

    function showWeek(which) {
      showPhotos = false;
      openClass = "";
      week = which === "b" ? "b" : "a";
      board.hidden = false;
      daysNav.hidden = false;
      classIndex.hidden = false;
      classPage.hidden = true;
      classPick.hidden = true;
      weeksNav.hidden = false;
      back.hidden = true;
      headTitle.href = DOC;
      headTitle.target = "_blank";
      headTitle.rel = "noopener";
      headTitle.textContent = "🐢Mr Ken's timetable 2026/27";
      meta.hidden = true;
      meta.textContent = "";
      document.getElementById("link-a").className = week === "a" ? "on" : "";
      document.getElementById("link-b").className = week === "b" ? "on" : "";
      renderTable();
    }

    function weekLetterFor(date) {
      const origin = Date.UTC(2026, 8, 7);
      const dow = date.getDay();
      let monday = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
      if (dow === 0) monday += 86400000;
      else if (dow === 6) monday += 2 * 86400000;
      else monday -= (dow - 1) * 86400000;
      const weeks = Math.floor((monday - origin) / (7 * 86400000));
      return ((weeks % 2) + 2) % 2 === 0 ? "a" : "b";
    }

    function currentWeekLetter() {
      return weekLetterFor(new Date());
    }

    function eventKind(code) {
      if (!code) return "";
      if (/duty/i.test(code)) return "duty";
      if (isClass(code) || ROOMS[code]) return "lesson";
      return "";
    }

    function dayBands(date) {
      const wed = date.getDay() === 3;
      return [
        ["hr", 8 * 60 + 30, 9 * 60],
        ["l1", 9 * 60, 9 * 60 + 40],
        ["l2", 9 * 60 + 40, 10 * 60 + 20],
        ["l3", 10 * 60 + 20, 11 * 60],
        ["rec", 11 * 60, 11 * 60 + 15],
        ["l4", 11 * 60 + 15, 11 * 60 + 55],
        ["l5", 11 * 60 + 55, wed ? 12 * 60 + 15 : 12 * 60 + 35],
        ["lunch", wed ? 12 * 60 + 15 : 12 * 60 + 35, 13 * 60 + 5],
        ["lrec", 13 * 60 + 5, 13 * 60 + 35],
        ["l6", 13 * 60 + 35, 14 * 60 + 15],
        ["l7", 14 * 60 + 15, 14 * 60 + 55],
        ["l8", 14 * 60 + 55, 15 * 60 + 35],
        ["end", 15 * 60 + 35, 15 * 60 + 45],
        ["late", 15 * 60 + 45, 16 * 60]
      ];
    }

    function atMins(date, mins) {
      return new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, mins, 0, 0);
    }

    function noteTimes(note) {
      const m = String(note || "").match(/^(\d{1,2}):(\d{2})–(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      return [Number(m[1]) * 60 + Number(m[2]), Number(m[3]) * 60 + Number(m[4])];
    }

    function eventsOn(date) {
      const col = date.getDay() - 1;
      if (col < 0 || col > 4) return [];
      const data = WEEK[weekLetterFor(date)];
      const list = [];
      dayBands(date).forEach(([id, start, end]) => {
        const code = (data[id] || [])[col] || "";
        const kind = eventKind(code);
        if (!kind) return;
        const note = (data[id + "Note"] || [])[col] || "";
        const times = noteTimes(note);
        const from = times ? times[0] : start;
        const to = times ? times[1] : end;
        const ev = { name: code, kind, start: atMins(date, from), end: atMins(date, to) };
        const last = list[list.length - 1];
        if (last && last.name === ev.name && last.kind === ev.kind && last.end.getTime() === ev.start.getTime()) {
          last.end = ev.end;
        } else {
          list.push(ev);
        }
      });
      return list;
    }

    function upcoming(now) {
      const events = [];
      for (let i = 0; i < 14; i++) {
        const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        events.push(...eventsOn(day));
      }
      const current = events.find(ev => now >= ev.start && now < ev.end);
      const next = events.find(ev => ev.start > now);
      return { current, next };
    }

    function clockText(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const days = Math.floor(total / 86400);
      const hours = Math.floor((total % 86400) / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      const pad = n => String(n).padStart(2, "0");
      const clock = pad(hours) + ":" + pad(mins) + ":" + pad(secs);
      return days ? days + (days === 1 ? " day " : " days ") + clock : clock;
    }

    let helloTick = 0;

    function paintHello() {
      const now = new Date();
      const { current, next } = upcoming(now);
      const text = document.getElementById("hello-text");
      const time = document.getElementById("hello-time");
      if (current) {
        text.textContent = "Good day Mr Ken🐢, your " + current.kind + " will end in";
        time.hidden = false;
        time.textContent = clockText(current.end - now);
        return;
      }
      if (next) {
        text.textContent = "Good day Mr Ken🐢, your " + next.name + " will start in";
        time.hidden = false;
        time.textContent = clockText(next.start - now);
        return;
      }
      text.textContent = "Good day Mr Ken🐢.";
      time.hidden = true;
      time.textContent = "";
    }

    function hideHello() {
      document.getElementById("hello").hidden = true;
      clearInterval(helloTick);
      helloTick = 0;
    }

    function showHello() {
      document.getElementById("hello").hidden = false;
      paintHello();
      clearInterval(helloTick);
      helloTick = setInterval(paintHello, 1000);
    }

    function route() {
      const rawHash = location.hash.replace("#", "");
      const list = rawHash.match(/^([0-9][A-Z]{2})-list$/i);
      if (list) {
        showClass(list[1].toUpperCase());
        return;
      }
      const raw = rawHash.toLowerCase();
      if (raw === "a" || raw === "b") showWeek(raw);
      else showWeek(currentWeekLetter());
    }

    document.getElementById("hello-ok").addEventListener("click", hideHello);
    document.getElementById("hello").addEventListener("click", e => {
      if (e.target.id === "hello") hideHello();
    });
    document.getElementById("link-a").addEventListener("click", () => { week = "a"; });
    document.getElementById("link-b").addEventListener("click", () => { week = "b"; });
    document.addEventListener("click", () => closePicks());
    window.addEventListener("hashchange", route);
    window.addEventListener("keydown", e => {
      if (e.key === "Escape" && !document.getElementById("hello").hidden) {
        hideHello();
        return;
      }
      if (e.key === "Escape" && document.querySelector(".open")) {
        closePicks();
        return;
      }
      if (e.key === "Escape" && !classPage.hidden) {
        location.hash = week;
        return;
      }
    });

    function clearPhotoHold() {
      if (photoHold) {
        clearTimeout(photoHold);
        photoHold = 0;
      }
    }
    headTitle.addEventListener("pointerdown", e => {
      if (classPage.hidden || !openClass) return;
      if (e.button) return;
      clearPhotoHold();
      photoHold = setTimeout(() => {
        photoHold = 0;
        showPhotos = !showPhotos;
        showClass(openClass);
      }, 2000);
    });
    headTitle.addEventListener("pointerup", clearPhotoHold);
    headTitle.addEventListener("pointercancel", clearPhotoHold);
    headTitle.addEventListener("pointerleave", clearPhotoHold);
    headTitle.addEventListener("contextmenu", e => {
      if (!classPage.hidden) e.preventDefault();
    });

    if (window.matchMedia("(max-width: 799px)").matches) {
      const n = new Date().getDay();
      dayFilter = n >= 1 && n <= 5 ? n : 0;
    }
    bodyFilter();
    renderDays();
    renderIndex();
    const start = location.hash.replace("#", "").toLowerCase();
    if (!start || start === "a" || start === "b") {
      const want = currentWeekLetter();
      if (start === want) route();
      else location.hash = want;
    } else {
      route();
    }
    showHello();
  </script>
</body>
</html>
